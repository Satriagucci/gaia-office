appId: com.bukainjalan.app
name: "03-membuat-misi-flow"
description: "Automation flow untuk membuat misi baru oleh pemberi kerja"
steps:
  - launchApp:
      clearState: false
  - tapOn:
      point: "540,2080" # FAB Buat Misi / Tombol Tengah
  - assertVisible:
      text: "Buat Misi Baru"
  - inputText:
      field: "mission_title"
      value: "Bantu Antar Dokumen ke Menteng"
  - inputText:
      field: "mission_description"
      value: "Perlu bantuan antar dokumen penting dari Senayan ke Menteng hari ini."
  - inputText:
      field: "mission_reward"
      value: "35000"
  - takeScreenshot: "03_create_mission_filled"
  - tapOn:
      text: "Lanjutkan ke Pembayaran"
  - assertVisible:
      text: "Deposit Escrow"
